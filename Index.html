<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Daily Journey</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,700;0,900;1,300;1,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #13161e;
    --card: #181c27;
    --border: rgba(255,255,255,0.07);
    --accent: #f0c040;
    --accent2: #7eb8f7;
    --accent3: #a78bfa;
    --green: #4ade80;
    --red: #f87171;
    --text: #e8e4db;
    --muted: #6b7280;
    --glow: rgba(240,192,64,0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Instrument Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Ambient background */
  body::before {
    content: '';
    position: fixed;
    top: -200px; left: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(240,192,64,0.06) 0%, transparent 70%);
    pointer-events: none;
    animation: drift 12s ease-in-out infinite alternate;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -100px; right: -100px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(126,184,247,0.05) 0%, transparent 70%);
    pointer-events: none;
    animation: drift 16s ease-in-out infinite alternate-reverse;
  }

  @keyframes drift {
    from { transform: translate(0,0); }
    to   { transform: translate(60px, 40px); }
  }

  /* Layout */
  .app {
    max-width: 780px;
    margin: 0 auto;
    padding: 40px 20px 80px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 44px;
    animation: fadeUp 0.7s ease both;
  }

  .header-eyebrow {
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
    opacity: 0.85;
  }

  .header-title {
    font-family: 'Fraunces', serif;
    font-size: clamp(42px, 9vw, 72px);
    font-weight: 900;
    line-height: 0.95;
    color: var(--text);
    letter-spacing: -2px;
  }

  .header-title span {
    color: var(--accent);
    font-style: italic;
  }

  .header-sub {
    margin-top: 14px;
    font-size: 14px;
    color: var(--muted);
    letter-spacing: 0.3px;
  }

  /* Quote bar */
  .quote-bar {
    background: linear-gradient(135deg, rgba(240,192,64,0.1), rgba(167,139,250,0.08));
    border: 1px solid rgba(240,192,64,0.2);
    border-radius: 16px;
    padding: 16px 24px;
    margin-bottom: 36px;
    display: flex;
    align-items: center;
    gap: 14px;
    animation: fadeUp 0.7s 0.1s ease both;
  }

  .quote-star { font-size: 22px; flex-shrink: 0; }

  .quote-text {
    font-family: 'Fraunces', serif;
    font-size: 15px;
    font-style: italic;
    font-weight: 300;
    color: var(--accent);
    line-height: 1.5;
  }

  /* Date navigation */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 32px;
    animation: fadeUp 0.7s 0.15s ease both;
  }

  .date-btn {
    width: 38px; height: 38px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  .date-display {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    min-width: 220px;
    text-align: center;
  }

  .date-display .today-badge {
    display: inline-block;
    font-family: 'Instrument Sans', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--bg);
    background: var(--accent);
    padding: 2px 8px;
    border-radius: 20px;
    margin-left: 8px;
    vertical-align: middle;
  }

  /* Mood selector */
  .mood-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 32px;
    animation: fadeUp 0.7s 0.2s ease both;
  }

  .mood-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 10px 14px;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.5px;
  }

  .mood-btn .emoji { font-size: 22px; }
  .mood-btn:hover { border-color: var(--accent); color: var(--text); transform: translateY(-2px); }
  .mood-btn.active { border-color: var(--accent); background: rgba(240,192,64,0.1); color: var(--accent); }

  /* Entry area */
  .entry-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    margin-bottom: 28px;
    animation: fadeUp 0.7s 0.25s ease both;
    transition: border-color 0.3s;
  }
  .entry-section:focus-within { border-color: rgba(240,192,64,0.3); }

  .section-label {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .journal-textarea {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-weight: 300;
    line-height: 1.8;
    resize: none;
    min-height: 140px;
    caret-color: var(--accent);
  }

  .journal-textarea::placeholder {
    color: var(--muted);
    font-style: italic;
  }

  /* Activity list */
  .activities-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    margin-bottom: 28px;
    animation: fadeUp 0.7s 0.3s ease both;
  }

  .add-activity-row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  .activity-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    color: var(--text);
    font-family: 'Instrument Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .activity-input:focus { border-color: rgba(240,192,64,0.4); }
  .activity-input::placeholder { color: var(--muted); }

  .add-btn {
    padding: 12px 20px;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 12px;
    font-family: 'Instrument Sans', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .add-btn:hover { background: #f5cf60; transform: translateY(-1px); }
  .add-btn:active { transform: translateY(0); }

  .activities-list { display: flex; flex-direction: column; gap: 8px; }

  .activity-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    transition: all 0.2s;
    animation: slideIn 0.3s ease both;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-12px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .activity-item:hover { border-color: rgba(255,255,255,0.12); }
  .activity-item.done { opacity: 0.55; }
  .activity-item.done .activity-text { text-decoration: line-through; color: var(--muted); }

  .check-btn {
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 2px solid var(--muted);
    background: transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    color: transparent;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .check-btn:hover { border-color: var(--green); }
  .activity-item.done .check-btn {
    background: var(--green);
    border-color: var(--green);
    color: #0d0f14;
  }

  .activity-text {
    flex: 1;
    font-size: 14px;
    color: var(--text);
    line-height: 1.4;
  }

  .activity-tag {
    font-size: 10px;
    letter-spacing: 1px;
    padding: 3px 8px;
    border-radius: 20px;
    background: rgba(126,184,247,0.12);
    color: var(--accent2);
    text-transform: uppercase;
    flex-shrink: 0;
  }

  .del-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 4px;
    border-radius: 6px;
    transition: all 0.2s;
    flex-shrink: 0;
    line-height: 1;
  }
  .del-btn:hover { color: var(--red); background: rgba(248,113,113,0.1); }

  /* Progress bar */
  .progress-wrap {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  .progress-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .progress-row span:last-child { color: var(--accent); font-weight: 600; }

  .progress-bar-bg {
    height: 6px;
    background: var(--surface);
    border-radius: 10px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent3));
    border-radius: 10px;
    transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* Save button */
  .save-btn {
    width: 100%;
    padding: 18px;
    background: linear-gradient(135deg, var(--accent), #e8a020);
    color: var(--bg);
    border: none;
    border-radius: 16px;
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s;
    letter-spacing: -0.3px;
    animation: fadeUp 0.7s 0.35s ease both;
    position: relative;
    overflow: hidden;
  }
  .save-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .save-btn:hover::before { opacity: 1; }
  .save-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(240,192,64,0.3); }
  .save-btn:active { transform: translateY(0); }

  /* Past entries */
  .past-section {
    margin-top: 48px;
    animation: fadeUp 0.7s 0.4s ease both;
  }

  .past-header {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .past-header::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .entry-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px 24px;
    margin-bottom: 16px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .entry-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
    border-radius: 2px 0 0 2px;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .entry-card:hover { border-color: rgba(240,192,64,0.2); transform: translateX(4px); }
  .entry-card:hover::before { opacity: 1; }

  .entry-card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .entry-card-date {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
  }

  .entry-card-mood { font-size: 20px; }

  .entry-card-preview {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .entry-card-tasks {
    margin-top: 10px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .task-pill {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    background: rgba(255,255,255,0.05);
    color: var(--muted);
  }
  .task-pill.done-pill {
    background: rgba(74,222,128,0.1);
    color: var(--green);
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--accent);
    color: var(--bg);
    padding: 12px 24px;
    border-radius: 50px;
    font-weight: 600;
    font-size: 14px;
    z-index: 999;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
  }
  .empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; line-height: 1.6; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Responsive */
  @media (max-width: 480px) {
    .mood-btn { padding: 8px 10px; }
    .mood-btn .emoji { font-size: 18px; }
    .date-display { font-size: 18px; min-width: 180px; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- Header -->
  <div class="header">
    <div class="header-eyebrow">✦ Your Personal Space ✦</div>
    <div class="header-title">Daily<br><span>Journey</span></div>
    <div class="header-sub">Write your story, one day at a time.</div>
  </div>

  <!-- Motivational Quote -->
  <div class="quote-bar">
    <div class="quote-star">✦</div>
    <div class="quote-text" id="quoteText">Loading your dose of motivation...</div>
  </div>

  <!-- Date navigation -->
  <div class="date-nav">
    <button class="date-btn" id="prevDay">‹</button>
    <div class="date-display" id="dateDisplay">—</div>
    <button class="date-btn" id="nextDay">›</button>
  </div>

  <!-- Mood -->
  <div class="mood-row" id="moodRow">
    <button class="mood-btn" data-mood="amazing"><span class="emoji">🌟</span>Amazing</button>
    <button class="mood-btn" data-mood="good"><span class="emoji">😊</span>Good</button>
    <button class="mood-btn" data-mood="okay"><span class="emoji">😐</span>Okay</button>
    <button class="mood-btn" data-mood="tough"><span class="emoji">😔</span>Tough</button>
    <button class="mood-btn" data-mood="rough"><span class="emoji">🌧️</span>Rough</button>
  </div>

  <!-- Journal Entry -->
  <div class="entry-section">
    <div class="section-label">✦ Today's Story</div>
    <textarea class="journal-textarea" id="journalText" placeholder="What happened today? How are you feeling? Write anything — big wins, small moments, things you're grateful for..."></textarea>
  </div>

  <!-- Activities -->
  <div class="activities-section">
    <div class="section-label">✦ Activities & Tasks</div>
    <div class="add-activity-row">
      <input type="text" class="activity-input" id="activityInput" placeholder="Add an activity, task, or goal..." />
      <button class="add-btn" id="addActivityBtn">+ Add</button>
    </div>
    <div class="activities-list" id="activitiesList"></div>
    <div class="progress-wrap" id="progressWrap" style="display:none">
      <div class="progress-row">
        <span>Progress</span>
        <span id="progressText">0 / 0 done</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
      </div>
    </div>
  </div>

  <!-- Save -->
  <button class="save-btn" id="saveBtn">✦ Save Today's Journey</button>

  <!-- Past entries -->
  <div class="past-section">
    <div class="past-header">Past Entries</div>
    <div id="pastList"></div>
  </div>

</div>

<div class="toast" id="toast">✓ Journey saved!</div>

<script>
const STORAGE_KEY = 'daily_journey_v2';
const MOODS = { amazing:'🌟', good:'😊', okay:'😐', tough:'😔', rough:'🌧️' };

const QUOTES = [
  "Small steps every day lead to big changes over time.",
  "You don't have to be perfect, you just have to keep going.",
  "Every evening is a chance to reflect and every morning a chance to begin again.",
  "Progress, not perfection, is the goal.",
  "Your story matters. Keep writing it.",
  "One day at a time. That's all you have to do.",
  "The fact that you're here, trying, is enough.",
  "Consistency beats intensity, always.",
  "Document the journey, not just the destination.",
  "Today's efforts are tomorrow's results.",
  "Be proud of how far you've come.",
  "Even the hardest days are adding to your story.",
];

// State
let currentDate = todayStr();
let entries = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
let activities = []; // [{text, done}]
let selectedMood = '';

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function formatDate(str) {
  const [y,m,d] = str.split('-').map(Number);
  const date = new Date(y, m-1, d);
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return `${days[date.getDay()]}, ${months[m-1]} ${d}`;
}

function formatDateShort(str) {
  const [y,m,d] = str.split('-').map(Number);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[m-1]} ${d}, ${y}`;
}

function shiftDate(str, days) {
  const [y,m,d] = str.split('-').map(Number);
  const date = new Date(y, m-1, d);
  date.setDate(date.getDate() + days);
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}

// Quote rotation
function setQuote() {
  const idx = new Date().getDate() % QUOTES.length;
  document.getElementById('quoteText').textContent = QUOTES[idx];
}

// Load entry for current date
function loadEntry() {
  const entry = entries[currentDate] || {};
  document.getElementById('journalText').value = entry.journal || '';
  activities = entry.activities ? JSON.parse(JSON.stringify(entry.activities)) : [];
  selectedMood = entry.mood || '';

  // Date display
  const isToday = currentDate === todayStr();
  document.getElementById('dateDisplay').innerHTML =
    formatDate(currentDate) + (isToday ? ' <span class="today-badge">TODAY</span>' : '');

  // Mood
  document.querySelectorAll('.mood-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mood === selectedMood);
  });

  renderActivities();
  renderPast();
}

function renderActivities() {
  const list = document.getElementById('activitiesList');
  const wrap = document.getElementById('progressWrap');

  if (activities.length === 0) {
    list.innerHTML = '';
    wrap.style.display = 'none';
    return;
  }

  list.innerHTML = '';
  activities.forEach((act, i) => {
    const item = document.createElement('div');
    item.className = 'activity-item' + (act.done ? ' done' : '');
    item.innerHTML = `
      <button class="check-btn" data-i="${i}">✓</button>
      <span class="activity-text">${escapeHtml(act.text)}</span>
      <button class="del-btn" data-del="${i}">✕</button>
    `;
    list.appendChild(item);
  });

  // Progress
  const done = activities.filter(a => a.done).length;
  const pct = Math.round((done / activities.length) * 100);
  wrap.style.display = 'block';
  document.getElementById('progressText').textContent = `${done} / ${activities.length} done`;
  document.getElementById('progressFill').style.width = pct + '%';
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderPast() {
  const container = document.getElementById('pastList');
  const keys = Object.keys(entries).sort().reverse().filter(k => k !== currentDate);

  if (keys.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">📖</div><p>No past entries yet.<br>Save today's journey to start your archive.</p></div>`;
    return;
  }

  container.innerHTML = '';
  keys.slice(0, 15).forEach(key => {
    const e = entries[key];
    const card = document.createElement('div');
    card.className = 'entry-card';
    const acts = e.activities || [];
    const done = acts.filter(a => a.done).length;

    let taskHTML = '';
    if (acts.length > 0) {
      taskHTML = `<div class="entry-card-tasks">` +
        acts.slice(0,4).map(a =>
          `<span class="task-pill ${a.done?'done-pill':''}">${a.done?'✓ ':''}${escapeHtml(a.text.substring(0,20))}${a.text.length>20?'…':''}</span>`
        ).join('') +
        (acts.length > 4 ? `<span class="task-pill">+${acts.length-4} more</span>` : '') +
        `</div>`;
    }

    card.innerHTML = `
      <div class="entry-card-top">
        <div class="entry-card-date">${formatDateShort(key)}</div>
        <div class="entry-card-mood">${MOODS[e.mood] || '📝'}</div>
      </div>
      <div class="entry-card-preview">${e.journal ? escapeHtml(e.journal) : '<em>No journal entry</em>'}</div>
      ${taskHTML}
    `;
    card.addEventListener('click', () => {
      currentDate = key;
      loadEntry();
      window.scrollTo({top: 0, behavior: 'smooth'});
    });
    container.appendChild(card);
  });
}

// Save
function saveEntry() {
  const journal = document.getElementById('journalText').value.trim();
  if (!journal && activities.length === 0 && !selectedMood) {
    showToast('Nothing to save yet! Write something first ✦');
    return;
  }
  entries[currentDate] = { journal, activities: JSON.parse(JSON.stringify(activities)), mood: selectedMood };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  showToast('✦ Journey saved!');
  renderPast();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// Events
document.getElementById('prevDay').addEventListener('click', () => {
  currentDate = shiftDate(currentDate, -1);
  loadEntry();
});
document.getElementById('nextDay').addEventListener('click', () => {
  currentDate = shiftDate(currentDate, 1);
  loadEntry();
});

document.getElementById('moodRow').addEventListener('click', e => {
  const btn = e.target.closest('.mood-btn');
  if (!btn) return;
  selectedMood = selectedMood === btn.dataset.mood ? '' : btn.dataset.mood;
  document.querySelectorAll('.mood-btn').forEach(b => b.classList.toggle('active', b.dataset.mood === selectedMood));
});

document.getElementById('addActivityBtn').addEventListener('click', addActivity);
document.getElementById('activityInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addActivity();
});

function addActivity() {
  const input = document.getElementById('activityInput');
  const text = input.value.trim();
  if (!text) return;
  activities.push({ text, done: false });
  input.value = '';
  renderActivities();
  input.focus();
}

document.getElementById('activitiesList').addEventListener('click', e => {
  const check = e.target.closest('.check-btn');
  const del = e.target.closest('.del-btn');
  if (check) {
    const i = parseInt(check.dataset.i);
    activities[i].done = !activities[i].done;
    renderActivities();
  }
  if (del) {
    const i = parseInt(del.dataset.del);
    activities.splice(i, 1);
    renderActivities();
  }
});

document.getElementById('saveBtn').addEventListener('click', saveEntry);

// Auto-save on typing (debounced)
let autoSaveTimer;
document.getElementById('journalText').addEventListener('input', () => {
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(() => {
    const journal = document.getElementById('journalText').value.trim();
    if (journal || activities.length > 0 || selectedMood) {
      entries[currentDate] = { journal, activities: JSON.parse(JSON.stringify(activities)), mood: selectedMood };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    }
  }, 1500);
});

// Init
setQuote();
loadEntry();
</script>
</body>
</html>
